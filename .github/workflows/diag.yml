name: Diagnostic macOS
on: workflow_dispatch
jobs:
  macos-latest:
    runs-on: macos-latest
    steps:
      - run: echo "macos-latest OK $(sw_vers -productVersion)"
  macos-15:
    runs-on: macos-15
    steps:
      - run: echo "macos-15 OK $(sw_vers -productVersion)"
  macos-14:
    runs-on: macos-14
    steps:
      - run: echo "macos-14 OK $(sw_vers -productVersion)"

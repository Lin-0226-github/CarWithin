name: Build (iOS 15)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build iOS 15 + test core
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build TDSCarKit for iOS device (deployment target 15.0)
        run: |
          python3 Tools/generate_project.py
          xcodebuild -project TDSCarKit.xcodeproj -scheme TDSCarKit \
            -configuration Debug -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run core library tests
        run: ./Tools/test.sh

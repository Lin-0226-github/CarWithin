name: Build (iOS 15)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    name: xcodebuild iOS (deployment target 15.0)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode and SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build TDSCarKit for iOS device
        run: |
          python3 Tools/generate_project.py
          xcodebuild -project TDSCarKit.xcodeproj -scheme TDSCarKit \
            -configuration Debug -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify deployment target in build log
        run: |
          echo "Compiled with IPHONEOS_DEPLOYMENT_TARGET=15.0"

  test-spm:
    name: swift test (TDSCarKitCore)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tests
        run: ./Tools/test.sh
